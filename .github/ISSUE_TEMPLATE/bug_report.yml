name: Bug report
description: Report a reproducible problem with background task behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove secrets and private paths from logs before submitting.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Pi, pi-background-task, Node.js, tmux, and operating-system versions
      placeholder: Pi 0.85.1, extension 0.1.0, Node 24, tmux 3.5, macOS 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
