name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - run: npm ci
      - name: Verify release tag
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      - run: npm run check:release-metadata
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Check whether this version is already published
        id: npm-version
        shell: bash
        run: |
          package_spec=$(node -p "const p=require('./package.json'); p.name+'@'+p.version")
          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$package_spec is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish
